<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2530" viewBox="0 0 1400 2530"><title>Algorithm Types and Applications</title><desc>Ten algorithms compared by training approach, domains, mechanism, and real-world application.</desc><rect width="1400" height="2530" fill="#fafaf8"/><rect width="1400" height="170" fill="#1a2744"/><text x="50" y="65" font-family="Arial,sans-serif" font-size="36" fill="#ffffff" font-weight="bold">Algorithm Types and Applications</text><text x="50" y="112" font-family="Arial,sans-serif" font-size="19" fill="#d4c9a8" font-weight="normal">Arvinnd Chowdary Kuchipudi | Model Development AIML-501 | Artifact 01</text><text x="50" y="210" font-family="Arial,sans-serif" font-size="21" fill="#1a2744" font-weight="normal">Training signal + application domain + task: compare all three before choosing a model.</text><text x="50" y="250" font-family="Arial,sans-serif" font-size="18" fill="#454b57" font-weight="normal">Supervised: external labels. Unsupervised: unlabeled structure. Self-supervised: targets created from data.</text><rect x="50" y="300" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="74" y="340" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">01 Linear Regression</text><text x="74" y="378" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Supervised</text><text x="74" y="406" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data</text><text x="74" y="443" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Fits a weighted linear relationship between features and a</text><text x="74" y="467" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">numeric target.</text><text x="74" y="533" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Estimate house prices from area, age, and location</text><text x="74" y="556" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">features.</text><text x="74" y="605" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Predict a number</text><rect x="715" y="300" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="739" y="340" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">02 Decision Tree</text><text x="739" y="378" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Supervised</text><text x="739" y="406" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data</text><text x="739" y="443" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Splits labeled examples using feature questions; leaves</text><text x="739" y="467" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">return a class or numeric estimate.</text><text x="739" y="533" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Classify fruit using extracted color and shape</text><text x="739" y="556" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">features.</text><text x="739" y="605" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Classify or predict</text><rect x="50" y="655" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="74" y="695" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">03 Random Forest</text><text x="74" y="733" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Supervised</text><text x="74" y="761" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data</text><text x="74" y="798" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Fits many randomized trees on resampled data and combines</text><text x="74" y="822" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">their predictions.</text><text x="74" y="888" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Predict customer churn from account and usage records.</text><text x="74" y="960" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Classify or predict</text><rect x="715" y="655" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="739" y="695" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">04 Gradient Boosting</text><text x="739" y="733" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Supervised</text><text x="739" y="761" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data</text><text x="739" y="798" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Adds models sequentially so each improves the current</text><text x="739" y="822" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">ensemble's loss.</text><text x="739" y="888" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Estimate insurance claim costs from policy features.</text><text x="739" y="960" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Classify or predict</text><rect x="50" y="1010" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="74" y="1050" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">05 Support Vector Machine</text><text x="74" y="1088" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Supervised</text><text x="74" y="1116" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data | NLP | Computer Vision</text><text x="74" y="1153" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Learns a maximum-margin boundary; kernels can represent</text><text x="74" y="1177" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">nonlinear separation.</text><text x="74" y="1243" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Detect spam using numerical features extracted from</text><text x="74" y="1266" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">email text.</text><text x="74" y="1315" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Classify</text><rect x="715" y="1010" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="739" y="1050" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">06 K-means</text><text x="739" y="1088" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Unsupervised</text><text x="739" y="1116" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data | Computer Vision</text><text x="739" y="1153" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Alternates assigning points to the nearest centroid and</text><text x="739" y="1177" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">updating cluster means.</text><text x="739" y="1243" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Group customers by purchasing behavior; quantize image</text><text x="739" y="1266" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">colors.</text><text x="739" y="1315" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Discover groups</text><rect x="50" y="1365" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="74" y="1405" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">07 Principal Component Analysis</text><text x="74" y="1443" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Unsupervised</text><text x="74" y="1471" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Tabular Data | Computer Vision</text><text x="74" y="1508" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Projects centered numerical features onto orthogonal</text><text x="74" y="1532" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">directions of greatest variance.</text><text x="74" y="1598" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Compress correlated sensor measurements or image</text><text x="74" y="1621" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">features.</text><text x="74" y="1670" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Reduce dimensions</text><rect x="715" y="1365" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="739" y="1405" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">08 Convolutional Neural Network</text><text x="739" y="1443" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Supervised example</text><text x="739" y="1471" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Computer Vision</text><text x="739" y="1508" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Learns local filters that build visual features across</text><text x="739" y="1532" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">layers; a classifier maps them to labels.</text><text x="739" y="1598" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Identify fruit species from labeled photographs.</text><text x="739" y="1670" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Recognize images</text><rect x="50" y="1720" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="74" y="1760" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">09 Transformer</text><text x="74" y="1798" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Self-supervised to supervised</text><text x="74" y="1826" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">NLP | Generative AI</text><text x="74" y="1863" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Attention combines contextual token information. Next-token</text><text x="74" y="1887" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">pretraining can be followed by labeled fine-tuning.</text><text x="74" y="1953" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: GPT-style text generation; fine-tuned BERT sentiment</text><text x="74" y="1976" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">classification.</text><text x="74" y="2025" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Understand or generate text</text><rect x="715" y="1720" width="635" height="330" rx="10" fill="#fff" stroke="#d1d7df"/><text x="739" y="1760" font-family="Arial,sans-serif" font-size="23" fill="#1a2744" font-weight="bold">10 Diffusion Model</text><text x="739" y="1798" font-family="Arial,sans-serif" font-size="16" fill="#256258" font-weight="bold">Unsupervised / self-supervised</text><text x="739" y="1826" font-family="Arial,sans-serif" font-size="15" fill="#72520e" font-weight="normal">Generative AI | Computer Vision</text><text x="739" y="1863" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">Learns to reverse added noise; repeated denoising generates</text><text x="739" y="1887" font-family="Arial,sans-serif" font-size="17" fill="#454b57" font-weight="normal">new samples.</text><text x="739" y="1953" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Example: Generate synthetic product images; text-conditioned</text><text x="739" y="1976" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">variants use image-caption pairs.</text><text x="739" y="2025" font-family="Arial,sans-serif" font-size="15" fill="#1a2744" font-weight="bold">Task: Generate images</text><text x="50" y="2110" font-family="Arial,sans-serif" font-size="25" fill="#1a2744" font-weight="bold">Key relationships</text><text x="50" y="2150" font-family="Arial,sans-serif" font-size="18" fill="#454b57" font-weight="normal">Decision Tree -&gt; Random Forest combines randomized trees; Gradient Boosting adds corrections sequentially.</text><text x="50" y="2200" font-family="Arial,sans-serif" font-size="18" fill="#454b57" font-weight="normal">K-means groups examples; PCA reduces dimensions. Transformer generation predicts tokens; diffusion reverses noise.</text><text x="50" y="2250" font-family="Arial,sans-serif" font-size="18" fill="#454b57" font-weight="normal">CNN and Transformer are architectures. Learning labels describe the specific training examples shown here.</text><text x="50" y="2300" font-family="Arial,sans-serif" font-size="18" fill="#454b57" font-weight="normal">Self-supervision is often grouped under unsupervised learning. Text-conditioned diffusion uses image-caption pairs.</text><text x="50" y="2370" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Sources: scikit-learn User Guide; LeCun et al. (1998); Vaswani et al. (2017); Devlin et al. (2019); Ho et al. (2020).</text><text x="50" y="2430" font-family="Arial,sans-serif" font-size="16" fill="#454b57" font-weight="normal">Full references: arvinndkuchipudi155-droid.github.io/aiml500-portfolio/model-development/artifacts/algorithm-types/</text></svg>