<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2240" viewBox="0 0 1400 2240" role="img" aria-labelledby="title desc"><title id="title">Explainable AI Understanding and Evaluating LLM Decisions</title><desc id="desc">A guide linking explanation challenges, industry techniques, validation metrics, and a worked example. An explanation must be checked alongside evidence and testing.</desc><rect width="1400" height="2240" fill="#f1f5f9"/><rect width="1400" height="290" fill="#152c43"/><text x="60" y="55" font-family="Arial,sans-serif" font-size="20" fill="#8cdbd0" font-weight="700">MODEL DEVELOPMENT  /  ARTIFACT 04</text><text x="60" y="121" font-family="Arial,sans-serif" font-size="60" fill="#ffffff" font-weight="700">Explainable AI</text><text x="60" y="172" font-family="Arial,sans-serif" font-size="34" fill="#ffffff" font-weight="400">Understanding and evaluating LLM decisions</text><text x="60" y="220" font-family="Arial,sans-serif" font-size="23" fill="#dce8f3" font-weight="400">XAI makes model behavior understandable to people. Useful explanations help people question an answer,</text><text x="60" y="250" font-family="Arial,sans-serif" font-size="23" fill="#dce8f3" font-weight="400">identify limits, and decide when human review is needed. [1]</text><text x="60" y="340" font-family="Arial,sans-serif" font-size="27" fill="#152c43" font-weight="700">01  WHY EXPLANATIONS ARE HARD</text><rect x="60" y="365" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="60" y="365" width="7" height="160" rx="3" fill="#8b4d22"/><text x="84" y="402" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Distributed computation</text><text x="84" y="440" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Concepts overlap across many parameters; a single</text><text x="84" y="470" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">neuron rarely supplies a complete explanation.</text><rect x="710" y="365" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="710" y="365" width="7" height="160" rx="3" fill="#8b4d22"/><text x="734" y="402" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Plausible explanations</text><text x="734" y="440" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">A fluent step-by-step answer can omit influences or</text><text x="734" y="470" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">justify an answer after the fact.</text><rect x="60" y="545" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="60" y="545" width="7" height="160" rx="3" fill="#8b4d22"/><text x="84" y="582" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Bias and changing context</text><text x="84" y="620" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Training-data bias, prompt changes, and unfamiliar</text><text x="84" y="650" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">inputs can alter behavior.</text><rect x="710" y="545" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="710" y="545" width="7" height="160" rx="3" fill="#8b4d22"/><text x="734" y="582" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Accountability and access</text><text x="734" y="620" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Restricted model access, privacy, and documentation</text><text x="734" y="650" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">obligations complicate audits.</text><text x="60" y="770" font-family="Arial,sans-serif" font-size="27" fill="#152c43" font-weight="700">02  WHAT INDUSTRY APPROACHES REVEAL</text><rect x="60" y="795" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="60" y="795" width="7" height="160" rx="3" fill="#156e68"/><text x="84" y="832" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">OpenAI · GPT-4</text><text x="84" y="870" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Sparse autoencoders reveal candidate features.</text><text x="84" y="900" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Useful building blocks, not a complete explanation.</text><text x="84" y="930" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">[2]</text><rect x="710" y="795" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="710" y="795" width="7" height="160" rx="3" fill="#156e68"/><text x="734" y="832" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Anthropic · Claude</text><text x="734" y="870" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Circuit tracing links features in selected tasks.</text><text x="734" y="900" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Partial pathways need intervention checks. [3]</text><rect x="60" y="975" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="60" y="975" width="7" height="160" rx="3" fill="#156e68"/><text x="84" y="1012" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Google · Gemma / Gemini</text><text x="84" y="1050" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Gemma Scope enables internal feature research.</text><text x="84" y="1080" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Gemini documents evaluations; Gemma findings do not</text><text x="84" y="1110" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">map Gemini internals. [4, 5]</text><rect x="710" y="975" width="630" height="160" rx="16" fill="white" stroke="#d7e0e8"/><rect x="710" y="975" width="7" height="160" rx="3" fill="#156e68"/><text x="734" y="1012" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Meta · Llama</text><text x="734" y="1050" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Model cards, evaluations, and red teaming aid</text><text x="734" y="1080" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">scrutiny. Open weights and safety scores do not</text><text x="734" y="1110" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">explain each output. [6]</text><text x="60" y="1202" font-family="Arial,sans-serif" font-size="27" fill="#152c43" font-weight="700">03  VALIDATE BEFORE RELYING ON THE ANSWER</text><text x="85" y="1250" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Correctness</text><text x="355" y="1250" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Does the answer match an expert-checked reference?</text><text x="85" y="1301" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Groundedness</text><text x="355" y="1301" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Are factual claims supported by the provided evidence?</text><text x="85" y="1352" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Robustness</text><text x="355" y="1352" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Does performance hold across paraphrases and difficult cases?</text><text x="85" y="1403" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Subgroup results</text><text x="355" y="1403" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Do relevant languages or user groups have different error rates?</text><text x="85" y="1454" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Faithfulness</text><text x="355" y="1454" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Do controlled interventions support the stated explanation?</text><text x="85" y="1525" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Use held-out cases, document sample sizes, and check automated judges against human review. These are</text><text x="85" y="1555" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">complementary checks, not a single trust score. [1, 6, 7]</text><text x="60" y="1640" font-family="Arial,sans-serif" font-size="27" fill="#152c43" font-weight="700">04  ONE ANSWER, THREE DIFFERENT CHECKS</text><rect x="60" y="1665" width="1280" height="205" rx="16" fill="white" stroke="#d7e0e8"/><rect x="60" y="1665" width="7" height="205" rx="3" fill="#355c94"/><text x="84" y="1702" font-family="Arial,sans-serif" font-size="25" fill="#355c94" font-weight="700">Illustration · A policy assistant</text><text x="84" y="1740" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Source: “Refunds are available within 30 days with a receipt.” A customer asks about day 45. An answer that</text><text x="84" y="1770" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">allows a refund contradicts the source, even if its explanation sounds convincing. Correctness checks the</text><text x="84" y="1800" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">rule; groundedness checks the cited passage; robustness tests reworded cases. No model experiment is claimed</text><text x="84" y="1830" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">here.</text><text x="85" y="1915" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Example metric</text><text x="355" y="1915" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">18 supported claims / 20 checked claims = 90% groundedness</text><text x="85" y="1954" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Interpretation</text><text x="355" y="1954" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Illustrative counts only. Two unsupported claims still need review.</text><rect x="60" y="1990" width="1280" height="96" rx="16" fill="#152c43"/><text x="85" y="2028" font-family="Arial,sans-serif" font-size="30" fill="#ffffff" font-weight="700">Explain behavior + test performance + document limits</text><text x="85" y="2065" font-family="Arial,sans-serif" font-size="23" fill="#dce8f3" font-weight="400">A clear explanation supports scrutiny. It does not guarantee correctness or safety.</text><text x="60" y="2130" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">SOURCES  [1] Phillips et al., 2021  [2] OpenAI, 2024  [3] Anthropic, 2025</text><text x="60" y="2160" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">[4] Google DeepMind, 2024  [5] Google, n.d.  [6] Meta, 2024  [7] Google Cloud, n.d.</text><text x="60" y="2203" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">Arvinnd Chowdary Kuchipudi  ·  AIML-501  ·  Full references and accessible text on the artifact page</text></svg>