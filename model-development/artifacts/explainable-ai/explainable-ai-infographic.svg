<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="3310" viewBox="0 0 1400 3310" role="img" aria-labelledby="title desc"><title id="title">Explainable AI Understanding and Evaluating LLM Decisions</title><desc id="desc">Four required topics: Explainable AI and its importance; challenges in explainability; validation and performance metrics; current solutions and techniques. Includes illustrative calculations and a policy-assistant example.</desc><rect width="1400" height="3310" fill="#f1f5f9"/><rect width="1400" height="245" fill="#152c43"/><text x="60" y="50" font-family="Arial,sans-serif" font-size="20" fill="#8cdbd0" font-weight="700">MODEL DEVELOPMENT / ARTIFACT 04</text><text x="60" y="118" font-family="Arial,sans-serif" font-size="60" fill="#ffffff" font-weight="700">Explainable AI</text><text x="60" y="172" font-family="Arial,sans-serif" font-size="34" fill="#ffffff" font-weight="400">Understanding and evaluating LLM decisions</text><text x="60" y="212" font-family="Arial,sans-serif" font-size="22" fill="#dce8f3" font-weight="400">A practical guide for learners, software teams, and project stakeholders</text><text x="60" y="300" font-family="Arial,sans-serif" font-size="29" fill="#152c43" font-weight="700">01  EXPLAINABLE AI &amp; ITS IMPORTANCE</text><rect x="60" y="325" width="1280" height="195" rx="16" fill="#ffffff" stroke="#d7e0e8"/><text x="86" y="366" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">What is XAI?</text><text x="320" y="366" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Methods that make model behavior or outputs understandable to people. Explanations</text><text x="320" y="396" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">should be meaningful, accurate, and clear about limits. [1]</text><text x="86" y="444" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Why it matters</text><text x="320" y="444" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Transparency helps people challenge errors, inspect evidence, and decide when human</text><text x="320" y="474" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">review is needed, especially in high-impact settings. [1, 8]</text><text x="60" y="584" font-family="Arial,sans-serif" font-size="29" fill="#152c43" font-weight="700">02  CHALLENGES IN EXPLAINABILITY</text><rect x="60" y="610" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="60" y="610" width="7" height="190" rx="3" fill="#8b4d22"/><text x="84" y="648" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Complexity and opacity</text><text x="84" y="687" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Many interacting parameters share concepts; no</text><text x="84" y="717" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">single component fully explains an output. [2]</text><text x="84" y="752" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Response: investigate features and causal evidence.</text><rect x="710" y="610" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="710" y="610" width="7" height="190" rx="3" fill="#8b4d22"/><text x="734" y="648" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Unfaithful explanations</text><text x="734" y="687" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">A fluent rationale can omit influences or justify</text><text x="734" y="717" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">an answer after the fact. [3]</text><text x="734" y="752" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Response: check claims against intervention evidence.</text><rect x="60" y="820" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="60" y="820" width="7" height="190" rx="3" fill="#8b4d22"/><text x="84" y="858" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Bias and changing context</text><text x="84" y="897" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Biased data, unfamiliar inputs, and prompt changes</text><text x="84" y="927" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">can alter behavior. [6]</text><text x="84" y="962" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Response: test groups, paraphrases, and edge cases.</text><rect x="710" y="820" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="710" y="820" width="7" height="190" rx="3" fill="#8b4d22"/><text x="734" y="858" font-family="Arial,sans-serif" font-size="25" fill="#8b4d22" font-weight="700">Regulatory and audit challenges</text><text x="734" y="897" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Auditability and disclosure needs must be balanced</text><text x="734" y="927" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">with privacy and restricted model access. [8]</text><text x="734" y="962" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Response: document evidence, versions, and limits.</text><text x="60" y="1075" font-family="Arial,sans-serif" font-size="29" fill="#152c43" font-weight="700">03  VALIDATION &amp; PERFORMANCE METRICS</text><text x="60" y="1112" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Define scoring rules, use held-out cases, and verify automated grading with human review. [6, 7]</text><rect x="60" y="1140" width="1280" height="104" rx="16" fill="#ffffff" stroke="#d7e0e8"/><circle cx="94" cy="1171" r="16" fill="#e0f2ee"/><text x="89" y="1177" font-family="Arial,sans-serif" font-size="18" fill="#156e68" font-weight="700">1</text><text x="125" y="1178" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Correctness</text><path d="M380 1156V1228" stroke="#d5e3e8"/><text x="405" y="1168" font-family="Arial,sans-serif" font-size="22" fill="#152c43" font-weight="700">Correct answers / scored answers</text><text x="405" y="1197" font-family="Arial,sans-serif" font-size="21" fill="#156e68" font-weight="400">Illustration: 46 / 50 = 92%</text><text x="405" y="1225" font-family="Arial,sans-serif" font-size="21" fill="#233d53" font-weight="400">Checks task success; inspect the severity of the four errors.</text><rect x="60" y="1256" width="1280" height="104" rx="16" fill="#ffffff" stroke="#d7e0e8"/><circle cx="94" cy="1287" r="16" fill="#e0f2ee"/><text x="89" y="1293" font-family="Arial,sans-serif" font-size="18" fill="#156e68" font-weight="700">2</text><text x="125" y="1294" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Groundedness</text><path d="M380 1272V1344" stroke="#d5e3e8"/><text x="405" y="1284" font-family="Arial,sans-serif" font-size="22" fill="#152c43" font-weight="700">Supported factual claims / reviewed factual claims</text><text x="405" y="1313" font-family="Arial,sans-serif" font-size="21" fill="#156e68" font-weight="400">Illustration: 18 / 20 = 90%</text><text x="405" y="1341" font-family="Arial,sans-serif" font-size="21" fill="#233d53" font-weight="400">Checks evidence support; the evidence itself may still be wrong.</text><rect x="60" y="1372" width="1280" height="104" rx="16" fill="#ffffff" stroke="#d7e0e8"/><circle cx="94" cy="1403" r="16" fill="#e0f2ee"/><text x="89" y="1409" font-family="Arial,sans-serif" font-size="18" fill="#156e68" font-weight="700">3</text><text x="125" y="1410" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Robustness</text><path d="M380 1388V1460" stroke="#d5e3e8"/><text x="405" y="1400" font-family="Arial,sans-serif" font-size="22" fill="#152c43" font-weight="700">Passed controlled variations / tested variations</text><text x="405" y="1429" font-family="Arial,sans-serif" font-size="21" fill="#156e68" font-weight="400">Illustration: 27 / 30 = 90%</text><text x="405" y="1457" font-family="Arial,sans-serif" font-size="21" fill="#233d53" font-weight="400">Checks stability under paraphrases and difficult cases.</text><rect x="60" y="1488" width="1280" height="104" rx="16" fill="#ffffff" stroke="#d7e0e8"/><circle cx="94" cy="1519" r="16" fill="#e0f2ee"/><text x="89" y="1525" font-family="Arial,sans-serif" font-size="18" fill="#156e68" font-weight="700">4</text><text x="125" y="1526" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Subgroup results</text><path d="M380 1504V1576" stroke="#d5e3e8"/><text x="405" y="1516" font-family="Arial,sans-serif" font-size="22" fill="#152c43" font-weight="700">Report correctness separately for relevant groups</text><text x="405" y="1545" font-family="Arial,sans-serif" font-size="21" fill="#156e68" font-weight="400">Illustration: group A 18/20 = 90%; group B 16/20 = 80%</text><text x="405" y="1573" font-family="Arial,sans-serif" font-size="21" fill="#233d53" font-weight="400">An average can hide gaps; report sample sizes and uncertainty.</text><rect x="60" y="1604" width="1280" height="104" rx="16" fill="#ffffff" stroke="#d7e0e8"/><circle cx="94" cy="1635" r="16" fill="#e0f2ee"/><text x="89" y="1641" font-family="Arial,sans-serif" font-size="18" fill="#156e68" font-weight="700">5</text><text x="125" y="1642" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Faithfulness</text><path d="M380 1620V1692" stroke="#d5e3e8"/><text x="405" y="1632" font-family="Arial,sans-serif" font-size="22" fill="#152c43" font-weight="700">Test whether claimed influences affect the result</text><text x="405" y="1661" font-family="Arial,sans-serif" font-size="21" fill="#156e68" font-weight="400">Use controlled interventions; inspect internal evidence when available.</text><text x="405" y="1689" font-family="Arial,sans-serif" font-size="21" fill="#233d53" font-weight="400">A convincing explanation or output change alone is insufficient.</text><text x="60" y="1753" font-family="Arial,sans-serif" font-size="22" fill="#8b4d22" font-weight="700">All counts above are hypothetical teaching examples, not results from model experiments.</text><text x="60" y="1787" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">These checks support reliability and trust together; no single metric establishes safety or compliance.</text><text x="60" y="1855" font-family="Arial,sans-serif" font-size="29" fill="#152c43" font-weight="700">04  CURRENT SOLUTIONS &amp; TECHNIQUES</text><text x="60" y="1892" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Internal explanation methods</text><rect x="60" y="1910" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="60" y="1910" width="7" height="190" rx="3" fill="#156e68"/><text x="84" y="1948" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">OpenAI · GPT-4</text><text x="84" y="1987" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Sparse autoencoders identify candidate</text><text x="84" y="2017" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">interpretable features in model activity. [2]</text><text x="84" y="2052" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Limit: feature maps do not explain every decision.</text><rect x="710" y="1910" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="710" y="1910" width="7" height="190" rx="3" fill="#156e68"/><text x="734" y="1948" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Anthropic · Claude</text><text x="734" y="1987" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Circuit tracing connects features involved in</text><text x="734" y="2017" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">selected computations. [3]</text><text x="734" y="2052" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Limit: partial pathways still need causal checks.</text><text x="60" y="2142" font-family="Arial,sans-serif" font-size="23" fill="#156e68" font-weight="700">Open research tools and complementary transparency</text><rect x="60" y="2160" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="60" y="2160" width="7" height="190" rx="3" fill="#156e68"/><text x="84" y="2198" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Google · Gemma / Gemini</text><text x="84" y="2237" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Gemma Scope opens feature-analysis tools. Gemini</text><text x="84" y="2267" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">documents evaluations and limitations. [4, 5]</text><text x="84" y="2302" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Limit: Gemma findings do not map Gemini internals.</text><rect x="710" y="2160" width="630" height="190" rx="16" fill="#ffffff" stroke="#d7e0e8"/><rect x="710" y="2160" width="7" height="190" rx="3" fill="#156e68"/><text x="734" y="2198" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">Meta · Llama</text><text x="734" y="2237" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Model cards, released weights, and red teaming</text><text x="734" y="2267" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">enable scrutiny and further research. [6]</text><text x="734" y="2302" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">Limit: disclosure and testing are not causal</text><text x="734" y="2332" font-family="Arial,sans-serif" font-size="20" fill="#536779" font-weight="400">explanations.</text><g aria-label="Three complementary sources of evidence support informed human review"><text x="60" y="2405" font-family="Arial,sans-serif" font-size="25" fill="#156e68" font-weight="700">How the evidence connects</text><rect x="60" y="2430" width="390" height="110" rx="14" fill="#e7f2f0" stroke="#b9d6d0"/><text x="80" y="2465" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#156e68">Explanation methods</text><text x="80" y="2496" font-family="Arial,sans-serif" font-size="21" fill="#233d53">Investigate candidate mechanisms</text><text x="80" y="2524" font-family="Arial,sans-serif" font-size="21" fill="#233d53">and test claimed influences.</text><rect x="505" y="2430" width="390" height="110" rx="14" fill="#e7f2f0" stroke="#b9d6d0"/><text x="525" y="2465" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#156e68">Validation evidence</text><text x="525" y="2496" font-family="Arial,sans-serif" font-size="21" fill="#233d53">Measure performance on defined</text><text x="525" y="2524" font-family="Arial,sans-serif" font-size="21" fill="#233d53">tasks and check failure patterns.</text><rect x="950" y="2430" width="390" height="110" rx="14" fill="#e7f2f0" stroke="#b9d6d0"/><text x="970" y="2465" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#156e68">Documented limitations</text><text x="970" y="2496" font-family="Arial,sans-serif" font-size="21" fill="#233d53">State intended use, uncertainty,</text><text x="970" y="2524" font-family="Arial,sans-serif" font-size="21" fill="#233d53">and boundaries of the evidence.</text><defs><marker id="evidence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#507888"/></marker></defs><g fill="none" stroke="#507888" stroke-width="3" marker-end="url(#evidence-arrow)"><path d="M255 2540V2560H560V2587"/><path d="M700 2540V2587"/><path d="M1145 2540V2560H840V2587"/></g><rect x="410" y="2590" width="580" height="76" rx="14" fill="#152c43"/><text x="700" y="2622" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Informed human review</text><text x="700" y="2650" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#dce8f3">Complementary evidence, not a guarantee of safety</text></g><text x="60" y="2772" font-family="Arial,sans-serif" font-size="27" fill="#152c43" font-weight="700">WORKED EXAMPLE  /  A POLICY ASSISTANT</text><rect x="60" y="2796" width="1280" height="180" rx="16" fill="#ffffff" stroke="#d7e0e8"/><text x="86" y="2835" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Policy: “Refunds are available within 30 days with a receipt.” A customer asks about day 45. An answer</text><text x="86" y="2865" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">allowing a refund contradicts the rule, even if its explanation sounds convincing.</text><text x="86" y="2910" font-family="Arial,sans-serif" font-size="22" fill="#233d53" font-weight="400">Correctness checks the rule; groundedness checks the cited evidence; robustness tests reworded cases.</text><rect x="60" y="3000" width="1280" height="94" rx="16" fill="#152c43" stroke="#d7e0e8"/><text x="86" y="3037" font-family="Arial,sans-serif" font-size="29" fill="#ffffff" font-weight="700">Explain behavior + test performance + document limits</text><text x="86" y="3074" font-family="Arial,sans-serif" font-size="22" fill="#dce8f3" font-weight="400">An understandable explanation supports scrutiny. It does not guarantee correctness or safety.</text><text x="60" y="3138" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">SOURCES  [1] Phillips et al., 2021  [2] OpenAI, 2024  [3] Anthropic, 2025</text><text x="60" y="3168" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">[4] Google DeepMind, 2024  [5] Google, n.d.  [6] Meta, 2024  [7] Google Cloud, n.d.  [8] NIST, 2023</text><text x="60" y="3218" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">Regulatory challenges are discussed generally; the graphic does not assert compliance with a specific law.</text><text x="60" y="3265" font-family="Arial,sans-serif" font-size="18" fill="#233d53" font-weight="400">Arvinnd Chowdary Kuchipudi · AIML-501 · Full references and accessible text on the artifact page</text></svg>