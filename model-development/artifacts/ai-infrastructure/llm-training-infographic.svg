<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2840" viewBox="0 0 1600 2840" role="img" aria-labelledby="title desc"><title id="title">The infrastructure behind an LLM</title><desc id="desc">Six training stages, four resource categories, historical model evidence, compute-cost estimates, and transparent energy and time calculations. Full accessible text and references accompany this graphic.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#59dfc4"/></marker><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#113e50"/><stop offset="1" stop-color="#172442"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="1600" height="2840" rx="0" fill="#091727" stroke="none"/><rect x="48" y="48" width="1504" height="350" rx="30" fill="url(#hero)" stroke="none"/><text x="92" y="103" fill="#59dfc4" font-size="21" font-weight="700">MODEL DEVELOPMENT  /  ARTIFACT 03</text><text x="92" y="182" fill="#f4f7fb" font-size="68" font-weight="700">The infrastructure</text><text x="92" y="259" fill="#f4f7fb" font-size="68" font-weight="700">behind an LLM</text><text x="96" y="313" fill="#b5c9d9" font-size="27" font-weight="400">From raw data to a deployed model: what the process consumes,</text><text x="96" y="350" fill="#b5c9d9" font-size="27" font-weight="400">why it matters, and what published evidence can actually tell us.</text><rect x="1270" y="115" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1283" y="128" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1339" y="115" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1352" y="128" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1408" y="115" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1421" y="128" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1270" y="184" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1283" y="197" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1339" y="184" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1352" y="197" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1408" y="184" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1421" y="197" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1270" y="253" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1283" y="266" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1339" y="253" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1352" y="266" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><rect x="1408" y="253" width="48" height="48" rx="9" fill="#24485a" stroke="#59dfc4"/><rect x="1421" y="266" width="22" height="22" rx="4" fill="#60d8be" stroke="none"/><text x="64" y="457" fill="#59dfc4" font-size="27" font-weight="700">01</text><text x="126" y="457" fill="#f4f7fb" font-size="37" font-weight="700">Follow the training lifecycle</text><text x="126" y="498" fill="#b5c9d9" font-size="22" font-weight="400">A simplified workflow; evaluation can send a model back for revision. [3, 4]</text><rect x="64" y="532" width="472" height="176" rx="22" fill="#11263b" stroke="none"/><text x="87" y="574" fill="#f4f7fb" font-size="27" font-weight="700">1  Collect</text><text x="87" y="611" fill="#b5c9d9" font-size="20" font-weight="400">Public, licensed, and human-created</text><text x="87" y="639" fill="#b5c9d9" font-size="20" font-weight="400">material; permissions and provenance.</text><text x="87" y="683" fill="#59dfc4" font-size="16" font-weight="700">DATA</text><path d="M539 615 L560 615" stroke="#59dfc4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="564" y="532" width="472" height="176" rx="22" fill="#11263b" stroke="none"/><text x="587" y="574" fill="#f4f7fb" font-size="27" font-weight="700">2  Prepare</text><text x="587" y="611" fill="#b5c9d9" font-size="20" font-weight="400">Filter, deduplicate, tokenize, and</text><text x="587" y="639" fill="#b5c9d9" font-size="20" font-weight="400">separate evaluation material.</text><text x="587" y="683" fill="#59dfc4" font-size="16" font-weight="700">DATA + COMPUTE</text><path d="M1039 615 L1060 615" stroke="#59dfc4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1064" y="532" width="472" height="176" rx="22" fill="#11263b" stroke="none"/><text x="1087" y="574" fill="#f4f7fb" font-size="27" font-weight="700">3  Pretrain</text><text x="1087" y="611" fill="#b5c9d9" font-size="20" font-weight="400">Predict tokens; backpropagate error</text><text x="1087" y="639" fill="#b5c9d9" font-size="20" font-weight="400">and update weights across accelerators.</text><text x="1087" y="683" fill="#59dfc4" font-size="16" font-weight="700">COMPUTE + ENERGY</text><rect x="1064" y="734" width="472" height="176" rx="22" fill="#11263b" stroke="none"/><text x="1087" y="776" fill="#f4f7fb" font-size="27" font-weight="700">4  Post-train</text><text x="1087" y="813" fill="#b5c9d9" font-size="20" font-weight="400">Instruction examples and preference</text><text x="1087" y="841" fill="#b5c9d9" font-size="20" font-weight="400">feedback shape useful behavior.</text><text x="1087" y="885" fill="#59dfc4" font-size="16" font-weight="700">DATA + COMPUTE</text><path d="M1060 817 L1039 817" stroke="#59dfc4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="564" y="734" width="472" height="176" rx="22" fill="#11263b" stroke="none"/><text x="587" y="776" fill="#f4f7fb" font-size="27" font-weight="700">5  Evaluate</text><text x="587" y="813" fill="#b5c9d9" font-size="20" font-weight="400">Check capability, bias, safety, and</text><text x="587" y="841" fill="#b5c9d9" font-size="20" font-weight="400">robustness before release.</text><text x="587" y="885" fill="#59dfc4" font-size="16" font-weight="700">COMPUTE + TIME</text><path d="M560 817 L539 817" stroke="#59dfc4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="64" y="734" width="472" height="176" rx="22" fill="#11263b" stroke="none"/><text x="87" y="776" fill="#f4f7fb" font-size="27" font-weight="700">6  Deploy &amp; monitor</text><text x="87" y="813" fill="#b5c9d9" font-size="20" font-weight="400">Serve predictions, track failures,</text><text x="87" y="841" fill="#b5c9d9" font-size="20" font-weight="400">and evaluate future revisions.</text><text x="87" y="885" fill="#59dfc4" font-size="16" font-weight="700">ONGOING OPERATIONS</text><path d="M1300 710 L1300 728" stroke="#59dfc4" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="64" y="951" fill="#59dfc4" font-size="27" font-weight="700">02</text><text x="126" y="951" fill="#f4f7fb" font-size="37" font-weight="700">Four resource budgets, one connected system</text><rect x="64" y="989" width="724" height="204" rx="22" fill="#11263b" stroke="none"/><g transform="translate(88 1013)" stroke="#59dfc4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="23" cy="8" rx="22" ry="7"/><path d="M1 8v30c0 10 44 10 44 0V8M1 22c0 10 44 10 44 0"/></g><text x="156" y="1044" fill="#f4f7fb" font-size="30" font-weight="700">Data</text><text x="90" y="1085" fill="#b5c9d9" font-size="23" font-weight="400">Acquire or license → clean → annotate.</text><text x="90" y="1114" fill="#b5c9d9" font-size="23" font-weight="400">Budget: access fees, labor, storage.</text><text x="90" y="1143" fill="#b5c9d9" font-size="23" font-weight="400">Better coverage can improve usefulness;</text><text x="90" y="1172" fill="#b5c9d9" font-size="23" font-weight="400">more tokens do not guarantee accuracy.</text><rect x="816" y="989" width="724" height="204" rx="22" fill="#11263b" stroke="none"/><g transform="translate(840 1013)" stroke="#b4a3ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="36" height="36" rx="5"/><rect x="15" y="15" width="16" height="16"/><path d="M14 0v5m18-5v5M14 41v5m18-5v5M0 14h5m-5 18h5m36-18h5m-5 18h5"/></g><text x="908" y="1044" fill="#f4f7fb" font-size="30" font-weight="700">Compute</text><text x="842" y="1085" fill="#b5c9d9" font-size="23" font-weight="400">GPUs / TPUs + memory + fast networks.</text><text x="842" y="1114" fill="#b5c9d9" font-size="23" font-weight="400">Budget: hardware or accelerator-hours.</text><text x="842" y="1143" fill="#b5c9d9" font-size="23" font-weight="400">Scale enables larger training workloads;</text><text x="842" y="1172" fill="#b5c9d9" font-size="23" font-weight="400">communication and failures reduce efficiency.</text><rect x="64" y="1215" width="724" height="204" rx="22" fill="#11263b" stroke="none"/><g transform="translate(88 1239)" stroke="#ffd179" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M26 0 6 27h16l-3 20 23-29H26Z"/></g><text x="156" y="1270" fill="#f4f7fb" font-size="30" font-weight="700">Energy</text><text x="90" y="1311" fill="#b5c9d9" font-size="23" font-weight="400">Accelerators, servers, and cooling use power.</text><text x="90" y="1340" fill="#b5c9d9" font-size="23" font-weight="400">Budget: kWh × electricity tariff.</text><text x="90" y="1369" fill="#b5c9d9" font-size="23" font-weight="400">Power delivery constrains feasible scale;</text><text x="90" y="1398" fill="#b5c9d9" font-size="23" font-weight="400">carbon impact also depends on the grid.</text><rect x="816" y="1215" width="724" height="204" rx="22" fill="#11263b" stroke="none"/><g transform="translate(840 1239)" stroke="#59dfc4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="24" r="21"/><path d="M23 10v15l12 7M17 0h12"/></g><text x="908" y="1270" fill="#f4f7fb" font-size="30" font-weight="700">Time</text><text x="842" y="1311" fill="#b5c9d9" font-size="23" font-weight="400">Preparation, training, evaluation, iteration.</text><text x="842" y="1340" fill="#b5c9d9" font-size="23" font-weight="400">Budget: calendar time and staff effort.</text><text x="842" y="1369" fill="#b5c9d9" font-size="23" font-weight="400">Parallelism can reduce elapsed time;</text><text x="842" y="1398" fill="#b5c9d9" font-size="23" font-weight="400">synchronization and rework limit the gain.</text><text x="64" y="1489" fill="#59dfc4" font-size="27" font-weight="700">03</text><text x="126" y="1489" fill="#f4f7fb" font-size="37" font-weight="700">Published evidence, with the scope attached</text><rect x="64" y="1527" width="724" height="332" rx="22" fill="#11263b" stroke="none"/><rect x="86" y="1543" width="288" height="34" rx="17" fill="#091727" stroke="none"/><text x="100" y="1567" fill="#ffd179" font-size="18" font-weight="700">HISTORICAL ESTIMATES</text><text x="90" y="1612" fill="#f4f7fb" font-size="29" font-weight="700">Training compute cost</text><text x="90" y="1658" fill="#f4f7fb" font-size="23" font-weight="400">GPT-4 (2023)</text><rect x="90" y="1680" width="240" height="27" rx="5" fill="#59dfc4" stroke="none"/><text x="350" y="1703" fill="#59dfc4" font-size="26" font-weight="700">≈ $78 million</text><text x="90" y="1749" fill="#f4f7fb" font-size="23" font-weight="400">Gemini Ultra (2023)</text><rect x="90" y="1771" width="586" height="27" rx="5" fill="#b4a3ff" stroke="none"/><text x="90" y="1834" fill="#b4a3ff" font-size="26" font-weight="700">≈ $191 million</text><rect x="812" y="1527" width="724" height="332" rx="22" fill="#11263b" stroke="none"/><rect x="835" y="1543" width="249" height="34" rx="17" fill="#091727" stroke="none"/><text x="849" y="1567" fill="#59dfc4" font-size="18" font-weight="700">PROVIDER-REPORTED</text><text x="838" y="1612" fill="#f4f7fb" font-size="29" font-weight="700">Llama 3.1 405B (2024)</text><text x="838" y="1677" fill="#59dfc4" font-size="48" font-weight="700">30.84 million</text><text x="838" y="1715" fill="#b5c9d9" font-size="24" font-weight="400">H100 GPU-hours of training compute [2]</text><text x="838" y="1776" fill="#f4f7fb" font-size="43" font-weight="700">~15 trillion</text><text x="838" y="1814" fill="#b5c9d9" font-size="22" font-weight="400">pretraining tokens for the Llama 3.1 family [2]</text><text x="70" y="1896" fill="#b5c9d9" font-size="22" font-weight="400">Cost bars share a zero baseline: $191M is about 2.45× $78M. Stanford AI Index estimates [1],</text><text x="70" y="1926" fill="#b5c9d9" font-size="22" font-weight="400">not provider invoices or total project budgets. Llama uses a different metric; no dollar rank is implied.</text><rect x="64" y="1975" width="1472" height="124" rx="22" fill="#163148" stroke="none"/><text x="90" y="2017" fill="#f4f7fb" font-size="26" font-weight="700">Claude 3 (2024)  /  A disclosure boundary</text><text x="90" y="2053" fill="#b5c9d9" font-size="22" font-weight="400">Anthropic reports public and non-public data plus AWS / Google Cloud infrastructure. Its cited model card</text><text x="90" y="2082" fill="#b5c9d9" font-size="22" font-weight="400">does not provide a total dollar training budget. “Not disclosed” does not mean zero. [4]</text><text x="64" y="2165" fill="#59dfc4" font-size="27" font-weight="700">04</text><text x="126" y="2165" fill="#f4f7fb" font-size="37" font-weight="700">Translate units without overstating certainty</text><rect x="64" y="2204" width="724" height="246" rx="22" fill="#11263b" stroke="none"/><g transform="translate(90 2227)" stroke="#ffd179" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M26 0 6 27h16l-3 20 23-29H26Z"/></g><text x="158" y="2260" fill="#f4f7fb" font-size="28" font-weight="700">Energy scale illustration</text><text x="90" y="2314" fill="#ffd179" font-size="29" font-weight="700">30.84M GPU-h × 0.7 kW</text><text x="90" y="2355" fill="#f4f7fb" font-size="38" font-weight="700">= 21.6 GWh</text><text x="90" y="2392" fill="#b5c9d9" font-size="20" font-weight="400">Nameplate-power proxy, not measured electricity.</text><text x="90" y="2419" fill="#b5c9d9" font-size="20" font-weight="400">Excludes non-GPU loads; actual power and PUE vary. [2]</text><rect x="812" y="2204" width="724" height="246" rx="22" fill="#11263b" stroke="none"/><g transform="translate(838 2227)" stroke="#59dfc4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="24" r="21"/><path d="M23 10v15l12 7M17 0h12"/></g><text x="906" y="2260" fill="#f4f7fb" font-size="28" font-weight="700">Time scale illustration</text><text x="838" y="2314" fill="#59dfc4" font-size="29" font-weight="700">1M GPU-h ÷ 1,000 GPUs</text><text x="838" y="2355" fill="#f4f7fb" font-size="36" font-weight="700">= 1,000 h ≈ 41.7 days</text><text x="838" y="2392" fill="#b5c9d9" font-size="20" font-weight="400">Hypothetical full utilization, not a model schedule.</text><text x="838" y="2419" fill="#b5c9d9" font-size="20" font-weight="400">Real elapsed time includes setup, stalls, and failures.</text><rect x="64" y="2482" width="1472" height="106" rx="22" fill="#163148" stroke="none"/><text x="90" y="2521" fill="#ffd179" font-size="25" font-weight="700">Read the budget correctly</text><text x="90" y="2561" fill="#f4f7fb" font-size="20" font-weight="400">Total effort includes data, people, experiments, compute, and operations. Avoid double-counting electricity inside compute prices.</text><path d="M64 2625 L1536 2625" stroke="#315066" stroke-width="2" fill="none"/><text x="64" y="2665" fill="#59dfc4" font-size="19" font-weight="700">SOURCES &amp; BOUNDARIES</text><text x="64" y="2700" fill="#b5c9d9" font-size="20" font-weight="400">[1] Stanford HAI, AI Index (2024).  [2] Meta, Llama 3.1 model card (2024).</text><text x="64" y="2729" fill="#b5c9d9" font-size="20" font-weight="400">[3] OpenAI, Foundation model development (n.d.).  [4] Anthropic, Claude 3 model card (2024).</text><text x="64" y="2758" fill="#b5c9d9" font-size="20" font-weight="400">Selected documented generations, not a ranking of the latest models. Full links and explanation accompany the graphic.</text><text x="64" y="2810" fill="#b5c9d9" font-size="18" font-weight="700">ARVINND KUCHIPUDI  •  AIML-501  •  INDIANA WESLEYAN UNIVERSITY  •  NOVEMBER 2026</text></svg>